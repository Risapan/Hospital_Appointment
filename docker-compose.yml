# Hospital Appointment System: MongoDB + Spring Boot backend + React/nginx frontend.
#
#   cp .env.example .env        # optional: change ports, passwords, JWT secret
#   docker compose up -d --build
#   open http://localhost:5174
#
# Every setting below has a working default, so `docker compose up` also works without a .env file.

name: hospital_appointment

services:
  mongo:
    image: mongo:7
    container_name: hospital_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-hospital}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-hospital_pass}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-hospital_db}
    ports:
      # Bound to localhost only, for MongoDB Compass. Host port 27018 avoids clashing with a local mongod.
      - "127.0.0.1:${MONGO_PORT:-27018}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [hospital_net]

  backend:
    build:
      context: ./backend
    image: hospital-appointment-backend:latest
    container_name: hospital_backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      SERVER_PORT: 8081
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-hospital}:${MONGO_ROOT_PASSWORD:-hospital_pass}@mongo:27017/${MONGO_DB:-hospital_db}?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:*,http://127.0.0.1:*}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75}
      TZ: Asia/Colombo
    ports:
      # Direct API access for Postman / REST Assured / JMeter. The browser goes through the frontend's /api proxy.
      - "${BACKEND_PORT:-8081}:8081"
    healthcheck:
      # /api/departments is a public GET endpoint (see SecurityConfig).
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8081/api/departments"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [hospital_net]

  frontend:
    build:
      context: ./frontend
    image: hospital-appointment-frontend:latest
    container_name: hospital_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5174}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [hospital_net]

networks:
  hospital_net:

volumes:
  mongo_data:
