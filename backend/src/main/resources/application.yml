server:
  port: 8080

spring:
  application:
    name: hospital-appointment-backend
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/hospital_db}
      auto-index-creation: true

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

logging:
  level:
    root: INFO
    com.hospital.appointment: DEBUG
    org.springframework.data.mongodb.core.MongoTemplate: DEBUG
